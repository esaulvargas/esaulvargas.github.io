guide:`<h2>🧍 Mi cuerpo y los seres vivos</h2>
<h3>Las 3 funciones vitales (life processes)</h3>
<p>Las personas somos seres vivos porque hacemos tres cosas para sobrevivir:</p>
<ul><li>🍎 <b>Nutrición (nutrition)</b>: sacamos energía y materias primas de la comida.</li>
<li>👀 <b>Sensibilidad (sensitivity)</b>: notamos lo que pasa a nuestro alrededor y respondemos.</li>
<li>🐣 <b>Reproducción (reproduction)</b>: tenemos bebés parecidos a nosotros.</li></ul>
<p>💡 <b>Truco:</b> ¡Nutrición, Sensibilidad, Reproducción! Un coche no hace ninguna de las tres, así que no es un ser vivo.</p>
<h3>Las partes del cuerpo (our body)</h3>
<p>Tiene tres partes: <b>cabeza (head)</b>, <b>tronco (trunk)</b> y <b>extremidades (limbs)</b>. En el tronco están el <b>tórax (thorax)</b> y el <b>abdomen</b>. Los brazos son las extremidades de arriba y las piernas, las de abajo.</p>
<p>Dentro tenemos <b>órganos (organs)</b>: estómago, corazón, pulmones, cerebro… ¡cada uno hace un trabajo!</p>
<h3>Huesos y músculos</h3>
<p>🦴 Los <b>huesos (bones)</b> son duros y fuertes. Todos juntos forman el <b>esqueleto (skeleton)</b>. Se doblan en las <b>articulaciones (joints)</b>, como el codo y la rodilla.</p>
<p>💪 Los <b>músculos (muscles)</b> son elásticos y están pegados a los huesos. Se <b>contraen</b> (se encogen) y se <b>relajan</b>, y así mueven el cuerpo.</p>
<p>🌟 <b>Curiosidad:</b> el fémur, el hueso del muslo, es el más largo de todos.</p>
<h3>Las etapas de la vida (stages of life)</h3>
<p>👶 Infancia → 🧒 Adolescencia → 🧑 Edad adulta → 👵 Vejez. Las personas mayores pierden fuerza, ¡pero pueden seguir muy activas!</p>
<h3>Las emociones</h3>
<p>😊 alegría, 😢 tristeza, 😠 enfado y 😮 sorpresa. Si estamos tristes o asustados mucho tiempo, hay que pedir ayuda a un adulto.</p>
<h3>Hábitos saludables (healthy habits)</h3>
<p>🚿 Higiene (ducha, manos y dientes limpios) · 🏃 ejercicio · 🥦 comida sana · 🪑 buena postura · 😴 dormir unas 10 horas · 💉 las vacunas nos protegen de enfermedades.</p>`,

<p>People are living things because we do three things to survive:</p>

const TABS=["quiz","tf","fill","cls","match","order","draw","fichas"],TI=["🔘","✅","✏️","📦","🔗","🔢","🎨","📝"];
let LG="en";try{LG=localStorage.getItem("lg")=="es"?"es":"en"}catch(e){}
const U={
en:{hi:"🔬 Hello, scientist! Let's explore",pk:"Pick a topic, do the exercises and win ⭐. You have ",st:" stars!",lt:"🌱 Mini lesson",
lx:"A <b>living thing</b> does three things: it <b>feeds</b> 🍎, it <b>senses</b> 👀 and it <b>reproduces</b> 🐣. Find out more in each topic!",
rev:"🎲 General review",home:"🏠 Home",guide:"📖 Guide",listen:"🔊 Listen",next:"Next ➡️",none:"There are no exercises of this type yet.",
oops:"Oops, this exercise could not load. Press Next.",good:"🎉 Well done!",bad:"🤔 Almost! Keep trying.",why:"Why?",close:"✖ Close",pages:"📄 Book pages",
miss:"Missing image ",clear:"🧽 Clear",model:"👀 See model",did:"⭐ I did it!",mod:"🔎 Model: ",comp:"Complete: ",t:"✅ True",f:"❌ False",
cls:"Tap a word and then the box where it goes.",mt:"Tap one on the left and its partner on the right.",or:"Tap the steps in order.",
dw:"Drawing and writing help you remember.",bes:"🇪🇸 Spanish",ben:"🇬🇧 Original",
nof:"There are no worksheets for this topic yet.",wd:"✏️ Words",ink:"Pen",er:"🧽 Eraser",ca:"🗑️ Clear all",mi:"Image not found: ",tabs:["Choose","True/False","Complete","Sort","Match","Order","Draw","Worksheets"],vo:"en-GB"},
es:{hi:"🔬 ¡Hola, científica! Vamos a explorar",pk:"Elige un tema, haz los ejercicios y consigue ⭐. ¡Tienes ",st:" estrellas!",lt:"🌱 Mini-lección",
lx:"Un <b>ser vivo</b> hace tres cosas: se <b>nutre</b> 🍎, <b>siente</b> 👀 y se <b>reproduce</b> 🐣. ¡Descubre más en cada tema!",
rev:"🎲 Repaso general",home:"🏠 Inicio",guide:"📖 Guía",listen:"🔊 Escuchar",next:"Siguiente ➡️",none:"Aún no hay ejercicios de este tipo.",
oops:"Ups, este ejercicio no se pudo cargar. Pulsa Siguiente.",good:"🎉 ¡Muy bien!",bad:"🤔 ¡Casi! Sigue intentándolo.",why:"¿Por qué?",close:"✖ Cerrar",pages:"📄 Páginas del libro",
miss:"Falta la imagen ",clear:"🧽 Borrar",model:"👀 Ver modelo",did:"⭐ ¡Ya lo hice!",mod:"🔎 Modelo: ",comp:"Completa: ",t:"✅ Verdadero",f:"❌ Falso",
cls:"Toca una palabra y luego la caja donde va.",mt:"Toca uno de la izquierda y su pareja de la derecha.",or:"Toca los pasos en orden.",
dw:"Dibujar y escribir ayuda a recordar.",bes:"🇪🇸 Español",ben:"🇬🇧 Original",
nof:"Todavía no hay fichas para este tema.",wd:"✏️ Palabras",ink:"Lápiz",er:"🧽 Goma",ca:"🗑️ Borrar todo",mi:"No se encuentra la imagen: ",tabs:["Elige","V o F","Completa","Clasifica","Relaciona","Ordena","Dibuja","Fichas"],vo:"es-ES"}};
const u=k=>U[LG][k],TP=()=>LG=="en"?TEN:TES;
let S={o:null,id:"",tab:"quiz"},pts=0,Q={},cur="",done=false,AC=null;
function snd(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{snd(660,.15);setTimeout(()=>snd(880,.2),130)},ko=()=>snd(200,.3,"triangle");
function say(t){try{const s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance)return;s.cancel();const x=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,""));x.lang=u("vo");x.rate=.9;s.speak(x)}catch(e){}}
function conf(){try{for(let i=0;i<24;i++){const d=document.createElement("div");d.className="cf";d.textContent=["⭐","🎉","✨","🌟"][i%4];d.style.left=Math.random()*95+"vw";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}catch(e){}}
const upd=()=>document.querySelectorAll(".pts").forEach(e=>e.textContent=pts);
const allTopic=()=>{const r={id:"all",icon:"🎲",title:u("rev"),guide:TP().map(t=>t.guide).join("<hr>")};TABS.forEach(k=>r[k]=[].concat(...TP().map(t=>t[k]||[])));return r};
const lgb=()=>`<span class="lg"><button class="${LG=="en"?"pri":""}" onclick="setL('en')">🇬🇧 English</button><button class="${LG=="es"?"pri":""}" onclick="setL('es')">🇪🇸 Español</button></span>`;
function setL(l){LG=l;try{localStorage.setItem("lg",l)}catch(e){}Q={};shut();try{window.speechSynthesis.cancel()}catch(e){}S.o?openT(S.id,S.tab):home()}

function home(){S.o=null;shut();document.documentElement.lang=LG;$("#app").innerHTML=`<main><div class="row">${lgb()}</div><h1>${u("hi")}</h1>
<p>${u("pk")}<b class="pts">${pts}</b>${u("st")}</p>
<div class="lesson"><h2>${u("lt")}</h2><p>${u("lx")}</p></div>
<div class="cards">${TP().map(t=>`<button class="card" onclick="openT('${t.id}')"><span class="ic">${t.icon}</span><b>${t.title}</b><br>${t.desc}</button>`).join("")}</div>
<button class="pri" onclick="openT('all')">${u("rev")}</button></main>`}
function openT(id,tab){S.id=id;S.o=id=="all"?allTopic():TP().find(t=>t.id==id);S.tab=tab||"quiz";S.f=0;shell()}
function shell(){document.documentElement.lang=LG;$("#app").innerHTML=`<div id="bar"><button onclick="home()">${u("home")}</button><button onclick="guide()">${u("guide")}</button>${lgb()}<b style="margin-left:auto">${S.o.icon} ⭐ <span class="pts">${pts}</span></b></div>
<main class="${S.tab=="fichas"?"wide":""}"><div class="tabs">${TABS.map((k,i)=>k=="fichas"&&!FL().length?"":`<button class="${k==S.tab?"pri":""}" onclick="S.tab='${k}';shell()">${TI[i]} ${u("tabs")[i]}</button>`).join("")}</div><div id="ex"></div></main>`;S.tab=="fichas"?loadFichas():loadEx()}
const FL=()=>FICHAS.filter(f=>S.id=="all"||f.t==S.id);
function loadFichas(){const L=FL(),ex=$("#ex");if(!L.length){ex.innerHTML="<p>"+u("nof")+"</p>";return}
const f=L[Math.min(S.f||0,L.length-1)],ti=f.title?f.title[LG=="en"?0:1]:f.img;
ex.innerHTML=(L.length>1?`<div class="row">${L.map((g,i)=>`<button class="${g===f?"pri":""}" onclick="S.f=${i};loadFichas()">${g.title?g.title[LG=="en"?0:1]:g.img}</button>`).join("")}</div>`:"")+
`<h2>${ti}</h2><div class="sheet"><div class="words"><b>${u("wd")}</b>${f.w.map(w=>`<span>${w}</span>`).join("")}</div><div class="wrap"><img alt="${ti}" src="imagenes/${f.img}"><canvas></canvas></div></div>
<div class="row pal"><button data-c="#1d4ed8" style="color:#1d4ed8">✏️ ${u("ink")}</button><button data-c="#d02020" style="color:#d02020">✏️</button><button data-c="#111" style="color:#111">✏️</button><button data-c="e">${u("er")}</button><button id="ca">${u("ca")}</button></div>
<div class="row"><button onclick="home()">${u("home")}</button><button onclick="guide()">${u("guide")}</button></div>`;
ex.querySelectorAll(".words span").forEach(e=>e.onclick=()=>e.classList.toggle("x"));
const im=$(".wrap img"),c=$(".wrap canvas"),x=c.getContext("2d");let col="#1d4ed8",d=false,lp=null,pen=false;
im.onerror=()=>{$(".wrap").innerHTML="<p style='line-height:1.4'>"+u("mi")+"<code>imagenes/"+f.img+"</code></p>"};
const fit=()=>{const w=im.clientWidth,h=im.clientHeight;if(!w||!h||(c.width==w&&c.height==h))return;const t=document.createElement("canvas");t.width=c.width;t.height=c.height;if(c.width)t.getContext("2d").drawImage(c,0,0);c.width=w;c.height=h;if(t.width)x.drawImage(t,0,0,w,h)};
im.onload=fit;if(im.complete)fit();window.onresize=fit;
const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
const st=e=>{x.lineCap="round";x.lineJoin="round";const er=col=="e";x.globalCompositeOperation=er?"destination-out":"source-over";x.strokeStyle=col;x.lineWidth=er?26:(e.pointerType=="pen"&&e.pressure?1.5+e.pressure*5:3)};
c.onpointerdown=e=>{if(e.pointerType=="pen")pen=true;else if(pen)return;e.preventDefault();d=true;try{c.setPointerCapture(e.pointerId)}catch(_){}lp=P(e);st(e);x.beginPath();x.moveTo(lp[0],lp[1]);x.lineTo(lp[0]+.1,lp[1]);x.stroke()};
c.onpointermove=e=>{if(!d)return;const p=P(e);st(e);x.beginPath();x.moveTo(lp[0],lp[1]);x.lineTo(p[0],p[1]);x.stroke();lp=p};
c.onpointerup=c.onpointercancel=()=>{d=false};
ex.querySelectorAll(".pal [data-c]").forEach(b=>b.onclick=()=>{col=b.dataset.c;ex.querySelectorAll(".pal [data-c]").forEach(y=>y.classList.remove("sel"));b.classList.add("sel")});
$("#ca").onclick=()=>x.clearRect(0,0,c.width,c.height)}
function pick(){const k=S.o.id+S.tab,pool=S.o[S.tab]||[];if(!pool.length)return null;let q=Q[k];if(!q||!q.l.length){const l=sh(pool);if(q&&l.length>1&&l[0]===q.last)l.push(l.shift());q={l,last:q?q.last:null};Q[k]=q}const it=q.l.shift();q.last=it;return it}
function loadEx(){done=false;const it=pick(),ex=$("#ex");if(!it){ex.innerHTML="<p>"+u("none")+"</p>";return}
ex.innerHTML=`<div id="q"></div><div id="fb"></div><div class="row"><button onclick="say(cur)">${u("listen")}</button><button class="pri" onclick="loadEx()">${u("next")}</button><button onclick="home()">${u("home")}</button><button onclick="guide()">${u("guide")}</button></div>`;
try{R[S.tab](it,$("#q"))}catch(e){ex.innerHTML="<p>"+u("oops")+"</p>"}}
function fin(g,w){if(done)return;done=true;if(g){pts++;upd();ok();conf()}else ko();$("#fb").innerHTML=`<div class="fbx ${g?"good":"bad"}"><b>${g?u("good"):u("bad")}</b><br>${u("why")} ${w}</div>`}
function mc(b,q,o,w,shuf,blank){cur=q.replace("____","…");const L=o.map((x,i)=>[x,i]),l=shuf?sh(L):L;
b.innerHTML=`<h2 id="qq">${q}</h2>`+l.map(([x,i])=>`<button class="opt" data-i="${i}">${x}</button>`).join("");
b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{if(done)return;const g=x.dataset.i=="0";x.classList.add(g?"good":"bad");if(!g)b.querySelector('[data-i="0"]').classList.add("good");if(blank)$("#qq").innerHTML=q.replace("____","<u>"+o[0]+"</u>");fin(g,w)})}
const flash=x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),500)};
const R={
quiz:(i,b)=>mc(b,i.q,i.o,i.w,1),
tf:(i,b)=>{mc(b,i.q,i.a?[u("t"),u("f")]:[u("f"),u("t")],i.w,0);if(!i.a){const bs=b.querySelectorAll(".opt");bs[0].parentNode.insertBefore(bs[1],bs[0])}},
fill:(i,b)=>mc(b,u("comp")+i.s,i.b,i.w,1,1),
cls:(it,b)=>{cur=it.t;let sel=null,n=it.i.length;
b.innerHTML=`<h2>${it.t}</h2><p>${u("cls")}</p><div id="pool">${sh(it.i).map(([x,c])=>`<button class="chip" data-c="${c}">${x}</button>`).join("")}</div><div class="boxes">${it.b.map((x,i)=>`<div class="bx" data-b="${i}"><b>${x}</b><div></div></div>`).join("")}</div>`;
b.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{b.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));sel=c;c.classList.add("sel")});
b.querySelectorAll(".bx").forEach(x=>x.onclick=()=>{if(!sel||done)return;if(sel.dataset.c==x.dataset.b){x.lastChild.appendChild(sel);sel.classList.remove("sel");sel.disabled=true;sel=null;ok();if(--n==0)fin(true,it.w)}else{ko();flash(sel)}})},
match:(it,b)=>{cur=it.t;let sel=null,n=it.p.length;const L=sh(it.p.map((p,i)=>[p[0],i])),Rr=sh(it.p.map((p,i)=>[p[1],i]));
const col=(a,s)=>`<div>${a.map(([x,i])=>`<button class="opt m" data-s="${s}" data-i="${i}">${x}</button>`).join("")}</div>`;
b.innerHTML=`<h2>${it.t}</h2><p>${u("mt")}</p><div class="two">${col(L,"l")}${col(Rr,"r")}</div>`;
b.querySelectorAll(".m").forEach(x=>x.onclick=()=>{if(x.classList.contains("good")||done)return;
if(x.dataset.s=="l"){b.querySelectorAll('[data-s="l"]').forEach(y=>y.classList.remove("sel"));sel=x;x.classList.add("sel");return}
if(!sel)return;if(sel.dataset.i==x.dataset.i){sel.classList.remove("sel");sel.classList.add("good");x.classList.add("good");sel=null;ok();if(--n==0)fin(true,it.w)}else{ko();flash(x)}})},
order:(it,b)=>{cur=it.t;let k=0;b.innerHTML=`<h2>${it.t}</h2><p>${u("or")}</p><ol id="ol"></ol><div id="pool">${sh(it.s.map((x,i)=>[x,i])).map(([x,i])=>`<button class="chip" data-i="${i}">${x}</button>`).join("")}</div>`;
b.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{if(c.disabled)return;if(c.dataset.i==k){k++;c.disabled=true;$("#ol").innerHTML+=`<li>${c.textContent}</li>`;ok();if(k==it.s.length)fin(true,it.w)}else{ko();flash(c)}})},
draw:(it,b)=>{cur=it.p;b.innerHTML=`<h2>${it.p}</h2><canvas id="cv"></canvas><div class="row"><button id="cl">${u("clear")}</button><button id="mo">${u("model")}</button><button class="pri" id="dn">${u("did")}</button></div><div id="mod" class="fbx good" style="display:none"></div>`;
const c=$("#cv");c.width=c.clientWidth||600;c.height=c.clientHeight||280;const x=c.getContext("2d");x.lineCap="round";x.strokeStyle="#1c2a39";let d=false,lp=null;
const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
const W=e=>e.pointerType=="pen"&&e.pressure?2+e.pressure*6:4;
c.onpointerdown=e=>{e.preventDefault();d=true;try{c.setPointerCapture(e.pointerId)}catch(_){}lp=P(e);x.lineWidth=W(e);x.beginPath();x.moveTo(lp[0],lp[1]);x.lineTo(lp[0]+.1,lp[1]);x.stroke()};
c.onpointermove=e=>{if(!d)return;const p=P(e);x.lineWidth=W(e);x.beginPath();x.moveTo(lp[0],lp[1]);x.lineTo(p[0],p[1]);x.stroke();lp=p};
c.onpointerup=c.onpointercancel=()=>{d=false};
$("#cl").onclick=()=>x.clearRect(0,0,c.width,c.height);
$("#mo").onclick=()=>{$("#mod").style.display="block";$("#mod").innerHTML=u("mod")+it.m};
$("#dn").onclick=()=>fin(true,it.w||u("dw"))}};

function guide(){const o=S.o,m=$("#md");m.innerHTML=`<div class="mb"><button class="pri" onclick="shut()">${u("close")}</button><div>${o.guide}</div>${o.pages?`<h3>${u("pages")}</h3><div id="bk"></div>`:""}<p><button class="pri" onclick="shut()">${u("close")}</button></p></div>`;m.classList.add("on");if(o.pages)book(0,LG)}
function shut(){const m=$("#md");if(m)m.classList.remove("on")}
function book(i,l){const o=S.o,n=`imagenes/${o.pre}_p${o.pages[i]}_${l}.png`;
$("#bk").innerHTML=`<div class="row">${o.pages.map((p,j)=>`<button class="${j==i?"pri":""}" onclick="book(${j},'${l}')">p. ${p}</button>`).join("")}</div><div class="row"><button class="${l=="es"?"pri":""}" onclick="book(${i},'es')">${u("bes")}</button><button class="${l=="en"?"pri":""}" onclick="book(${i},'en')">${u("ben")}</button></div><img alt="p. ${o.pages[i]}" src="${n}"><p class="miss" hidden>${u("miss")}<code>${n}</code></p>`;
const im=$("#bk img");im.onerror=()=>{im.hidden=true;$("#bk .miss").hidden=false}}
$("#md").onclick=e=>{if(e.target.id=="md")shut()};
document.addEventListener("keydown",e=>{if(e.key=="Escape")shut()});
home();
</script></body></html>
