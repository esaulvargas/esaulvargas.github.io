<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sílabas, diptongos e hiatos</title>
<style>
:root{--p:#d6336c;--p2:#a61e4d;--bg:#fff5f8;--ink:#2b2a4c;--ok:#1f9d55;--ko:#e03131;--sun:#ffd43b;--w:#1971c2;--wbg:#d0ebff;--wink:#0b3d6b}
*{box-sizing:border-box}
body{margin:0;font:21px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;font-weight:600;min-height:56px;padding:10px 18px;border:3px solid var(--p);border-radius:18px;background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.pri{background:var(--p);color:#fff}
main{max-width:940px;margin:auto;padding:14px}
h1{font-size:34px;margin:.3em 0}h2{font-size:26px;margin:.5em 0}
#bar{flex-wrap:wrap;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:4px solid var(--p)}
.lesson{background:#fff7dd;border:3px solid var(--sun);border-radius:20px;padding:6px 18px;margin:12px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin:14px 0}
.card{text-align:left;min-height:150px;padding:16px;border-width:4px;font-weight:400}
.card .ic{font-size:46px;display:block}.card b{font-size:25px}
.tag{display:inline-block;font-size:16px;font-weight:700;background:var(--sun);border-radius:10px;padding:0 8px;margin-left:6px;vertical-align:middle}
.tabs,.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tabs button{padding:8px 14px;font-size:19px;min-height:52px}
/* palabras = azul; recuadros = colores distintos */
.opt,.chip,.sy,.vw,.num{background:var(--wbg);border-color:var(--w);color:var(--wink)}
.opt{display:block;width:100%;margin:8px 0;text-align:left;font-size:23px}
.chip{margin:5px;font-size:24px}.chip:disabled{opacity:1}
.sy{font-size:34px;margin:6px 4px}
.num{width:78px;font-size:34px;margin:6px}
.word{font-size:46px;font-weight:800;text-align:center;background:#fff;border:4px solid var(--p);border-radius:20px;padding:8px 16px;margin:10px 0}
.emo{font-size:64px;text-align:center;line-height:1.1}
.tn{color:var(--p2);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.tg{background:#fff3bf;border-radius:12px;padding:0 4px}
.lt{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0;font-size:44px;font-weight:800}
.lt .vw{font-size:44px;min-height:64px;min-width:52px;padding:0 6px;margin:0 1px}
.gp{width:30px;min-height:64px;padding:0;border:3px dashed #adb5bd;border-radius:10px;background:transparent;color:var(--p2)}
.gp::after{content:"·"}.gp.on{border:3px solid var(--p);background:#ffe3ee}.gp.on::after{content:"-";font-size:34px}
.good{background:#c8f1d8!important;border-color:var(--ok)!important;color:#0b4d27!important}
.bad{background:#ffd6d6!important;border-color:var(--ko)!important}
.sel{background:#ffe066!important;border-color:#f08c00!important;color:#5c3b00!important}
.fbx{border:3px solid;border-radius:16px;padding:8px 16px;margin:10px 0}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.bx{border:4px dashed var(--c);background:var(--bg2);border-radius:18px;padding:8px;min-height:120px}
.bx>b{color:var(--c);font-size:23px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m[data-s="r"]{background:#ffe8d6;border-color:#e8590c;color:#7a2f00}
#md{position:fixed;inset:0;background:rgba(40,20,30,.55);display:none;z-index:20;align-items:center;justify-content:center;padding:12px}
#md.on{display:flex}
.mb{background:#fff;border-radius:22px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.mb h3{color:var(--p2);margin:1em 0 .2em}
.cf{position:fixed;top:-40px;font-size:30px;animation:f 1.8s linear forwards;z-index:30;pointer-events:none}
@keyframes f{to{transform:translateY(115vh) rotate(360deg)}}
ol{padding-left:34px}li{font-size:23px}
@media(max-width:560px){body{font-size:19px}.two{grid-template-columns:1fr}h1{font-size:28px}.lt,.lt .vw{font-size:34px}}
@media(prefers-reduced-motion:reduce){.cf{display:none}}
</style></head><body>
<div id="app"></div><div id="md"></div>
<script>
/* ================= BANCO DE PALABRAS =================
 Para añadir una palabra, escribe una línea nueva: sílabas separadas con guion, la sílaba TÓNICA en MAYÚSCULAS
 (con su tilde si la lleva) y, si quieres, | y un emoji.  Ejemplo:  "pa-RA-guas|🌂"   "ca-MIÓN|🚚"   "SOL|☀️"
 La app deduce sola: nº de sílabas, aguda/llana/esdrújula, diptongo, hiato y tilde. */
const RAW=[
/* monosílabas */
"SOL|☀️","PAN|🍞","FLOR|🌸","MAR|🌊","LUZ|💡","TREN|🚆","MIEL|🍯","PIE|🦶","SAL|🧂","MES","CIEN",
/* llanas de 2 sílabas */
"ME-sa","SI-lla|🪑","CA-sa|🏠","GA-to|🐱","PE-rro|🐶","LI-bro|📖","MO-no|🐵","NU-be|☁️","BO-ta|🥾","MA-no|✋","RO-sa|🌹",
"ÁR-bol|🌳","LÁ-piz|✏️","CÉS-ped|🌱","CÁR-cel","FÁ-cil","DÉ-bil","ÁN-gel|👼","ÁL-bum|📒","Ú-til","MÓ-vil|📱","DÁ-til","a-ZÚ-car|🍬",
/* con diptongo (llanas) */
"NIE-ve|❄️","LLU-via|🌧️","PUEN-te|🌉","VIEN-to|💨","PIA-no|🎹","HUE-vo|🥚","HIE-lo|🧊","DIEN-te|🦷","FUE-go|🔥","A-gua|💧","CIE-lo|🌤️",
"TIE-rra|🌍","CUER-po|🧍","PUE-blo|🏘️","AI-re|🌬️","PEI-ne","BAI-le|💃","AU-to|🚗","JAU-la","PAU-sa|⏸️","CUA-tro","SUA-ve","NO-vio","GRA-cias","PA-tio",
"a-cei-TU-na|🫒","de-SIER-to|🏜️","cir-CUI-to","es-CUE-la|🏫","fa-MI-lia|👪","es-TU-dio","cui-DA-do|⚠️","eu-RO-pa",
/* agudas */
"re-LOJ|⌚","pa-RED|🧱","pa-PEL|📄","mu-JER|👩","jar-DÍN|🌷","bal-CÓN","ca-FÉ|☕","a-ZUL|🔵","can-TAR|🎤","so-FÁ|🛋️","a-BRIL|📅","ca-LOR|🥵",
"ra-TÓN|🐭","co-ra-ZÓN|❤️","pan-ta-LÓN|👖","ti-bu-RÓN|🦈","ven-da-VAL|🌪️","te-ne-DOR|🍴","ca-ra-COL|🐌","a-ni-MAL|🐾",
"ca-MIÓN|🚚","a-VIÓN|✈️","can-CIÓN|🎶","ciu-DAD|🏙️",
/* llanas de 3 o más sílabas */
"pe-LO-ta|⚽","ven-TA-na|🪟","ca-MI-sa|👕","pa-LO-ma|🕊️","ca-NE-la","pa-TA-ta|🥔","ma-ri-PO-sa|🦋","e-le-FAN-te|🐘","bi-ci-CLE-ta|🚲","pa-RA-guas|🌂",
/* esdrújulas */
"MÚ-si-ca|🎵","te-LÉ-fo-no|📞","MÉ-di-co|🧑‍⚕️","PÁ-ja-ro|🐦","SÁ-ba-na|🛏️","PLÁ-ta-no|🍌","hi-po-PÓ-ta-mo|🦛","Á-gui-la|🦅","CÁ-ma-ra|📷","PÉ-ta-lo",
"NÚ-me-ro|🔢","ÁR-bo-les|🌳","BRÚ-ju-la|🧭","CÍR-cu-lo|⭕","MÁ-gi-co|🪄","SÍ-la-ba","MÁ-qui-na|⚙️","pi-RÁ-mi-de|🔺","ki-LÓ-me-tro","mur-CIÉ-la-go|🦇",
"neu-MÁ-ti-co|🛞","CÓ-me-lo","DÍ-me-lo",
/* sobresdrújulas */
"CUÉN-ta-se-lo","CÓ-me-te-lo","ex-PLÍ-ca-me-lo","DÍ-ga-se-lo","LLÉ-va-te-lo","CÓM-pra-me-lo","re-GÁ-la-se-lo","Á-bre-te-lo",
/* hiatos simples (dos vocales fuertes) */
"po-E-ta|✍️","te-A-tro|🎭","ca-ER","le-ER","cre-ER","po-E-ma|📜","mu-SE-o|🏛️","co-RRE-o|✉️","i-DE-a|💡","to-A-lla|🛁","pa-E-lla|🥘","BO-a|🐍",
"ma-ES-tro|👩‍🏫","le-ÓN|🦁","HÉ-ro-e|🦸","o-CÉ-a-no|🌊",
/* hiatos con tilde en la vocal débil */
"DÍ-a|☀️","TÍ-o|👨","TÍ-a|👩","RÍ-o|🏞️","FRÍ-o|🥶","ba-ÚL|🧳","ma-ÍZ|🌽","pa-ÍS|🗺️","ra-ÍZ|🌱","po-li-CÍ-a|👮","pa-na-de-RÍ-a|🥖","li-bre-RÍ-a|📚",
"re-ÍR|😄","o-Í-do|👂","he-ro-Í-na|🦸‍♀️","con-ti-NÚ-a"
];

/* ================= ANÁLISIS DE CADA PALABRA (automático) ================= */
const V="aeiouáéíóúü",isV=c=>!!c&&V.includes(c);
const UN={á:"a",é:"e",í:"i",ó:"o",ú:"u"},AC={a:"á",e:"é",i:"í",o:"ó",u:"ú"};
const unac=s=>s.replace(/[áéíóú]/g,c=>UN[c]);
const mudo=s=>s.replace(/([qg])u(?=[eiéí])/g,"$1·");
const TN={aguda:"aguda",llana:"llana",esdrujula:"esdrújula",sobresdrujula:"sobresdrújula",mono:"monosílaba"};
function mk(r){const[a,emo]=r.split("|"),p=a.split("-"),s=p.map(x=>x.toLowerCase());
const t=p.findIndex(x=>x===x.toUpperCase()&&x!==x.toLowerCase()),w=s.join(""),n=s.length;
const o={w,s,t,n,emo:emo||"",tilde:/[áéíóú]/.test(w),dph:[],hia:[]};
o.type=n==1?"mono":["aguda","llana","esdrujula","sobresdrujula"][Math.min(n-1-t,3)];
let off=0;s.forEach((x,i)=>{const c=mudo(x);for(let j=0;j<c.length-1;j++)if(isV(c[j])&&isV(c[j+1]))o.dph.push({i,pair:unac(x.slice(j,j+2)),at:off+j});
if(i<n-1){const nx=mudo(s[i+1]),a1=c[c.length-1],b1=nx[0];if(isV(a1)&&isV(b1))o.hia.push({i,a:a1,b:b1,ac:"íú".includes(a1)||"íú".includes(b1)})}off+=x.length});
o.hiAc=o.hia.some(h=>h.ac);
o.kind=o.dph.length&&!o.hia.length?"diptongo":o.hia.length&&!o.dph.length?"hiato":!o.dph.length&&!o.hia.length?"ninguno":"mixto";
return o}
const BANK=RAW.map(mk);
const NH=w=>!w.hia.length;               /* sin hiato (los hiatos aún no se han visto en el libro) */
const cutsOf=o=>{let c=0;const r=[];for(let i=0;i<o.n-1;i++){c+=o.s[i].length;r.push(c)}return r};
const fmt=(w,cuts)=>[...w].map((c,i)=>(cuts.includes(i)?"-":"")+c).join("");
const vowelIdx=w=>{const r=[];[...w].forEach((c,j)=>{if(isV(c)&&!(c=="u"&&j>0&&"qg".includes(w[j-1])&&"eiéí".includes(w[j+1]||"")))r.push(j)});return r};
const accIdx=o=>[...o.w].findIndex(c=>"áéíóú".includes(c));
function tvi(o){let off=0;for(let i=0;i<o.t;i++)off+=o.s[i].length;const c=mudo(o.s[o.t]),ix=[];for(let j=0;j<c.length;j++)if(isV(c[j]))ix.push(j);if(!ix.length)return -1;const st=ix.find(j=>"aeoáéó".includes(c[j]));return off+(st!==undefined?st:ix[ix.length-1])}
const endN=o=>{const l=unac(o.w).slice(-1);return l=="n"?"N":l=="s"?"S":isV(l)?"vocal":l.toUpperCase()};
const ruleTilde=o=>o.type=="aguda"?/[nsaeiou]$/.test(unac(o.w)):o.type=="llana"?!/[nsaeiou]$/.test(unac(o.w)):o.type=="esdrujula"||o.type=="sobresdrujula";
const POS={aguda:"última",llana:"penúltima",esdrujula:"antepenúltima",sobresdrujula:"anterior a la antepenúltima"};
const whyTilde=o=>{const e=endN(o);
if(o.hiAc){const h=o.hia.find(x=>x.ac),v="íú".includes(h.a)?h.a:h.b;return`Tiene un hiato: la vocal débil «${v}» suena fuerte, así que se separa de la otra vocal y siempre lleva tilde.`}
if(o.type=="aguda")return o.tilde?`Es aguda y acaba en ${e}: las agudas llevan tilde cuando acaban en N, S o vocal.`:`Es aguda y acaba en ${e}: no es N, S ni vocal, así que no lleva tilde.`;
if(o.type=="llana")return o.tilde?`Es llana y acaba en ${e}: las llanas llevan tilde cuando NO acaban en N, S ni vocal.`:`Es llana y acaba en ${e}: acaba en N, S o vocal, así que no lleva tilde.`;
if(o.type=="esdrujula")return"Es esdrújula: las esdrújulas siempre llevan tilde.";
if(o.type=="sobresdrujula")return"Es sobresdrújula: las sobresdrújulas siempre llevan tilde.";return""};
const descr=o=>{let r="";if(o.dph.length){const d=o.dph[0];r+=` En «${o.s[d.i]}» las vocales «${d.pair}» van juntas en la misma sílaba: es un diptongo.`}
if(o.hia.length){const h=o.hia[0];r+=h.ac?` «${"íú".includes(h.a)?h.a:h.b}» es una vocal débil pero suena fuerte (lleva tilde): rompe el diptongo y forma un hiato.`:` «${h.a}» y «${h.b}» son vocales fuertes: van en sílabas distintas, es un hiato.`}return r};
const divTxt=o=>`Se separa así: <b>${o.s.join("-")}</b>.${descr(o)}`;
const syl=(o,hl,un)=>o.s.map((x,i)=>{x=un?unac(x):x;return i==o.t&&hl?`<span class="tn">${x}</span>`:x}).join("-");

/* ================= UTILIDADES ================= */
const $=s=>document.querySelector(s);
const sh=a=>{a=a.slice();for(let i=a.length;i>1;){const j=Math.random()*i|0;i--;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];
let pts=0,cur="",curS=null,done=false,S={o:null,tab:"",last:""},RECENT={},AC_=null;
function pickW(key,flt,n=1){const c=BANK.filter(flt);if(!c.length)return[];const rec=RECENT[key]=RECENT[key]||[];let f=c.filter(x=>!rec.includes(x.w));if(f.length<n)f=c;const r=sh(f).slice(0,n);r.forEach(x=>rec.push(x.w));const lim=Math.max(0,Math.min(8,c.length-n-1));while(rec.length>lim)rec.shift();return r}
function snd(f,d,t){try{AC_=AC_||new(window.AudioContext||window.webkitAudioContext)();const o=AC_.createOscillator(),g=AC_.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC_.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC_.currentTime+d);o.stop(AC_.currentTime+d)}catch(e){}}
const okS=()=>{snd(660,.15);setTimeout(()=>snd(880,.2),130)},koS=()=>snd(200,.3,"triangle");
function say(t){try{const s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance||!t)return;s.cancel();const x=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,""));x.lang="es-ES";x.rate=.85;s.speak(x)}catch(e){}}
function saySyl(){try{if(!curS||!curS.length)return say(cur);const s=window.speechSynthesis;if(!s||!window.SpeechSynthesisUtterance)return;s.cancel();curS.forEach(t=>{const x=new SpeechSynthesisUtterance(t);x.lang="es-ES";x.rate=.6;s.speak(x)})}catch(e){}}
function conf(){try{for(let i=0;i<24;i++){const d=document.createElement("div");d.className="cf";d.textContent=["⭐","🎉","✨","🌟"][i%4];d.style.left=Math.random()*95+"vw";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}catch(e){}}
const upd=()=>document.querySelectorAll(".pts").forEach(e=>e.textContent=pts);
const flash=x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),500)};
function fin(g,w){if(done)return;done=true;if(g){pts++;upd();okS();conf()}else koS();$("#fb").innerHTML=`<div class="fbx ${g?"good":"bad"}"><b>${g?"🎉 ¡Muy bien!":"🤔 ¡Casi! Sigue intentándolo."}</b><br>${w}</div>`}
const setW=o=>{cur=o.w;curS=o.s.slice()};
const card=(o,txt)=>`<div class="emo">${o.emo}</div><div class="word">${txt==null?o.w:txt}</div>`;
/* botones de respuesta: L = opciones en el orden en que se ven, ci = índice de la correcta */
function two(b,h,L,ci,w){b.innerHTML=h+L.map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join("");
b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{if(done)return;const g=+x.dataset.i==ci;x.classList.add(g?"good":"bad");if(!g)b.querySelector(`[data-i="${ci}"]`).classList.add("good");fin(g,w)})}
const mc=(b,h,o,w,shuf)=>{const L=shuf?sh(o):o;two(b,h,L,L.indexOf(o[0]),w)};
/* clasificar: palabras azules, cada recuadro con su color */
const BC=[["#d6336c","#ffe3ee"],["#2b8a3e","#e0f5e6"],["#e8590c","#fff0d9"],["#862e9c","#f3e5fa"]];
function cls(b,t,boxes,items,w){curS=null;cur="";let sel=null,n=items.length;
b.innerHTML=`<h2>${t}</h2><p>Toca una palabra azul 🔵 y luego el recuadro de color donde va. (Con 🔊 la oyes.)</p><div id="pool">${sh(items).map(([x,c])=>`<button class="chip" data-c="${c}">${x}</button>`).join("")}</div><div class="boxes">${boxes.map((x,i)=>`<div class="bx" data-b="${i}" style="--c:${BC[i][0]};--bg2:${BC[i][1]}"><b>${x}</b><div></div></div>`).join("")}</div>`;
b.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{if(c.disabled)return;b.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));sel=c;c.classList.add("sel");cur=c.textContent});
b.querySelectorAll(".bx").forEach(x=>x.onclick=()=>{if(!sel||done)return;if(sel.dataset.c==x.dataset.b){const k=BC[+x.dataset.b];x.lastChild.appendChild(sel);sel.classList.remove("sel");sel.style.cssText=`background:${k[1]};border-color:${k[0]};color:${k[0]}`;sel.disabled=true;sel=null;okS();if(--n==0)fin(true,w)}else{koS();flash(sel)}})}
function grp(key,flt,n){return pickW(key,flt,n)}
/* emparejar */
function match(b,t,pairs,w){curS=null;cur=t;let sel=null,n=pairs.length;const L=sh(pairs.map((p,i)=>[p[0],i])),R=sh(pairs.map((p,i)=>[p[1],i]));
const col=(a,s)=>`<div>${a.map(([x,i])=>`<button class="opt m" data-s="${s}" data-i="${i}">${x}</button>`).join("")}</div>`;
b.innerHTML=`<h2>${t}</h2><p>Toca una palabra azul y después su pareja naranja.</p><div class="two">${col(L,"l")}${col(R,"r")}</div>`;
b.querySelectorAll(".m").forEach(x=>x.onclick=()=>{if(x.classList.contains("good")||done)return;
if(x.dataset.s=="l"){b.querySelectorAll('[data-s="l"]').forEach(y=>y.classList.remove("sel"));sel=x;x.classList.add("sel");cur=x.textContent;return}
if(!sel)return;if(sel.dataset.i==x.dataset.i){sel.classList.remove("sel");sel.classList.add("good");x.classList.add("good");sel=null;okS();if(--n==0)fin(true,w)}else{koS();flash(x)}})}

/* ================= RETOS (cada uno es específico de su tema) ================= */
/* --- sílabas --- */
const sepaF=(key,flt)=>b=>{const[o]=pickW(key,flt);cur=o.w;curS=null;const L=[...o.w],cu=cutsOf(o);
b.innerHTML=`<h2>Separa la palabra en sílabas</h2><p>Toca entre las letras donde va cada guion y pulsa Comprobar.</p><div class="emo">${o.emo}</div><div class="lt">${L.map((c,i)=>`<span>${c}</span>${i<L.length-1?`<button class="gp" data-i="${i+1}" aria-label="separar"></button>`:""}`).join("")}</div><div class="row" style="justify-content:center"><button class="pri" id="ck">✔️ Comprobar</button></div>`;

{id:"sil",icon:"🧩",title:"Sílabas",desc:"Separa, cuenta y construye palabras sílaba a sílaba.",acts:["sepa","cuenta","clasN","cons","divi"],
guide:`<h2>🧩 La sílaba</h2>
<p>Una <b>sílaba</b> es un golpe de voz: cada vez que abres y cierras la boca al decir una palabra, dices una sílaba. Todas las sílabas tienen al menos una vocal: <i>pan, me-sa, ca-ra-col</i>.</p>
<h3>Según el número de sílabas</h3>
<ul><li><b>Monosílabas</b>: una sílaba → <i>sol, pan, flor</i></li><li><b>Bisílabas</b>: dos → <i>me-sa, ca-lor</i></li><li><b>Trisílabas</b>: tres → <i>pe-lo-ta</i></li><li><b>Polisílabas</b>: más de tres → <i>bi-ci-cle-ta</i></li></ul>
<p>💡 <b>Truco:</b> pon la mano bajo la barbilla y di la palabra despacio. Cada vez que la barbilla baja, ¡es una sílaba!</p>
<p>🐢 Con el botón «Por sílabas» oirás la palabra a trocitos.</p>`},
{id:"dip",icon:"🤝",title:"Diptongos",desc:"Dos vocales juntas en la misma sílaba: ai-re, a-gua, pa-tio.",acts:["hayD","rodea","parD","debil","sepaD"],
guide:`<h2>🤝 El diptongo</h2>
<p>Las vocales <b>a, e, o</b> son <b>fuertes</b> 💪. Las vocales <b>i, u</b> son <b>débiles</b> 🪶.</p>
<p>Un <b>diptongo</b> es la unión de <b>dos vocales en la misma sílaba</b>:</p>
<ul><li>una fuerte y una débil: <i>ai-re, a-gua, pa-tio, nie-ve</i></li><li>o dos débiles: <i>ciu-dad, cui-da-do</i></li></ul>
<p>Las dos vocales suenan en <b>un solo golpe de voz</b>, y por eso no se separan al dividir en sílabas.</p>
<p>💡 <b>Ojo:</b> en <i>que, qui, gue, gui</i> la u no suena, así que no hay diptongo: <i>má-qui-na, á-gui-la</i>.</p>`},
{id:"hia",icon:"🙅",title:"Hiatos",desc:"Dos vocales fuertes juntas que se separan: po-e-ta, te-a-tro.",tag:"⭐ Ampliación",acts:["sepaH","dhH","clsH","diviH"],
guide:`<h2>🙅 El hiato</h2>
<p><i>(Es una ampliación: todavía no aparece en tu libro.)</i></p>
<p>Un <b>hiato</b> es cuando <b>dos vocales van juntas pero en sílabas distintas</b>.</p>
<p>Pasa, por ejemplo, con <b>dos vocales fuertes</b> (a, e, o): <i>po-e-ta, te-a-tro, ca-er, le-er, mu-se-o</i>. Las dos vocales no se pueden juntar en un solo golpe de voz, así que cada una va en su sílaba.</p>
<p>💡 <b>Truco:</b> di la palabra despacio. Si notas <b>dos golpes de voz</b> en las vocales, es hiato. Si notas <b>uno</b>, es diptongo.</p>
<p>Compara: <i>pa-tio</i> (diptongo, una sílaba «tio») y <i>te-a-tro</i> (hiato, «a» va sola).</p>`},
{id:"ton",icon:"🔊",title:"Sílaba tónica",desc:"Agudas, llanas, esdrújulas y sobresdrújulas.",acts:["ton","agll","esso","cuatro","como"],
guide:`<h2>🔊 La sílaba tónica</h2>
<p>En cada palabra hay una sílaba que suena <b>más fuerte</b>: es la <b>sílaba tónica</b>. Las demás son <b>átonas</b>. Ejemplo: <i>tor-MEN-ta</i>.</p>
<p>Para saber qué tipo de palabra es, <b>cuenta desde el final</b>:</p>
<ul><li><b>Aguda</b>: la tónica es la <b>última</b> → <i>ra-TÓN, re-LOJ</i></li><li><b>Llana</b>: la tónica es la <b>penúltima</b> → <i>ME-sa, ÁR-bol</i></li><li><b>Esdrújula</b>: la tónica es la <b>antepenúltima</b> → <i>MÚ-si-ca</i></li><li><b>Sobresdrújula</b>: la tónica está <b>más lejos</b> → <i>CUÉN-ta-se-lo</i></li></ul>
<p>💡 <b>Truco:</b> di la palabra bien fuerte y alarga una sílaba. Si la que alargas es la última, es aguda; si es la de antes, es llana…</p>`},
{id:"til",icon:"´",title:"La tilde",desc:"Cuándo una palabra lleva tilde y dónde se pone.",acts:["lleva","bien","pon","por"],
guide:`<h2>´ La tilde</h2>
<p>La <b>tilde</b> es la rayita que se pone sobre la vocal de la sílaba tónica. Si hay diptongo, va en la vocal fuerte.</p>
<ul><li><b>Agudas</b>: llevan tilde si acaban en <b>N, S o vocal</b> → <i>ca-mión, sofá</i> ✓ pero <i>re-loj, pa-red</i> ✗</li>
<li><b>Llanas</b>: llevan tilde si <b>NO</b> acaban en N, S ni vocal → <i>ár-bol, lá-piz</i> ✓ pero <i>me-sa, ca-mi-sa</i> ✗</li>
<li><b>Esdrújulas</b>: <b>siempre</b> llevan tilde → <i>mú-si-ca, te-lé-fo-no</i></li>
<li><b>Sobresdrújulas</b>: <b>siempre</b> llevan tilde → <i>cuén-ta-se-lo</i></li></ul>
<p>💡 <b>Truco:</b> las reglas de las agudas y las llanas son <b>contrarias</b>. Las agudas necesitan acabar en N, S o vocal; las llanas necesitan NO acabar así.</p>`},
{id:"hit",icon:"✨",title:"Hiatos con tilde",desc:"Cuando la i o la u suenan fuertes y rompen el diptongo.",tag:"⭐ Ampliación",acts:["ponT","dhT","bienT","sepaT","clsT"],
guide:`<h2>✨ Hiatos con tilde</h2>
<p><i>(Ampliación: es lo más difícil del tema. ¡Tómatelo con calma!)</i></p>
<p>Normalmente <b>i</b> y <b>u</b> son vocales débiles y se unen a otra vocal formando un diptongo (<i>pa-tio, a-gua</i>).</p>
<p>Pero a veces la <b>i</b> o la <b>u</b> suenan <b>fuertes</b>, con el golpe de voz encima. Entonces <b>se separan</b> de la otra vocal y <b>siempre llevan tilde</b>, aunque no sigan las reglas de agudas y llanas:</p>
<p><i>dí-a, rí-o, tí-o, ba-úl, ma-íz, ra-íz, pa-ís, po-li-cí-a, re-ír</i></p>
<p>💡 <b>Truco:</b> compara <i>pa-tio</i> (la i es débil: diptongo, sin tilde) con <i>dí-a</i> (la í suena fuerte: hiato, con tilde).</p>`}
];
const ALL={id:"all",icon:"🎲",title:"Repaso general",guide:TOP.map(t=>t.guide).join("<hr>"),acts:Object.keys(ACT)};

/* ================= PANTALLAS ================= */
function home(){S.o=null;shut();$("#app").innerHTML=`<main><h1>📚 ¡Hola! Vamos a jugar con las sílabas</h1>
<p>Elige lo que quieres practicar, haz los retos y consigue estrellas ⭐. Tienes <b class="pts">${pts}</b> estrellas.</p>
<div class="lesson"><h2>🔊 Mini-lección</h2><p>Las palabras se dividen en <b>sílabas</b>. La que suena más fuerte es la <b>sílaba tónica</b>. A veces esa fuerza se marca con una <b>tilde</b> ( ´ ). ¡Descubre las reglas en cada tema!</p></div>
<div class="cards">${TOP.map(t=>`<button class="card" onclick="openT('${t.id}')"><span class="ic">${t.icon}</span><b>${t.title}</b>${t.tag?`<span class="tag">${t.tag}</span>`:""}<br>${t.desc}</button>`).join("")}</div>
<button class="pri" onclick="openT('all')">🎲 Repaso general (retos sorpresa)</button></main>`}
function openT(id,tab){S.o=id=="all"?ALL:TOP.find(t=>t.id==id);S.tab=tab||S.o.acts[0];S.last="";shell()}
function shell(){$("#app").innerHTML=`<div id="bar"><button onclick="home()">🏠 Inicio</button><button onclick="guide()">📖 Guía</button><b style="margin-left:auto">${S.o.icon} ⭐ <span class="pts">${pts}</span></b></div>
<main><h2 style="margin-top:.2em">${S.o.icon} ${S.o.title}</h2>${S.o.id=="all"?"":`<div class="tabs">${S.o.acts.map(k=>`<button class="${k==S.tab?"pri":""}" onclick="S.tab='${k}';shell()">${ACT[k].i} ${ACT[k].l}</button>`).join("")}</div>`}<div id="hd"></div><div id="ex"></div></main>`;loadEx()}
function loadEx(){done=false;cur="";curS=null;let id=S.tab;if(S.o.id=="all"){id=rnd(S.o.acts.filter(k=>k!=S.last));S.last=id}
$("#hd").innerHTML=S.o.id=="all"?`<p><b>${ACT[id].i} ${ACT[id].l}</b></p>`:"";
$("#ex").innerHTML=`<div id="q"></div><div id="fb"></div><div class="row"><button onclick="say(cur)">🔊 Escuchar</button><button onclick="saySyl()">🐢 Por sílabas</button><button class="pri" onclick="loadEx()">Siguiente ➡️</button><button onclick="home()">🏠 Inicio</button><button onclick="guide()">📖 Guía</button></div>`;
try{ACT[id].f($("#q"))}catch(e){console.error(e);$("#q").innerHTML="<p>Ups, este reto no se pudo cargar. Pulsa Siguiente.</p>"}}
function guide(){const m=$("#md");m.innerHTML=`<div class="mb"><button class="pri" onclick="shut()">✖ Cerrar</button><div>${S.o.guide}</div><p><button class="pri" onclick="shut()">✖ Cerrar</button></p></div>`;m.classList.add("on")}
function shut(){const m=$("#md");if(m)m.classList.remove("on")}
$("#md").onclick=e=>{if(e.target.id=="md")shut()};
document.addEventListener("keydown",e=>{if(e.key=="Escape")shut()});
home();
</script></body></html>
